# IRSA service account for the pod. The role must trust the cluster OIDC provider
# and allow dynamodb:PutItem on the audit table. Create the role in
# fdp-infra-compute (or via `eksctl create iamserviceaccount`) and pass its ARN
# as AUDIT_IRSA_ROLE_ARN. If auditing stays disabled the annotation is harmless.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: fraud-detection
  annotations:
    eks.amazonaws.com/role-arn: "${AUDIT_IRSA_ROLE_ARN}"
