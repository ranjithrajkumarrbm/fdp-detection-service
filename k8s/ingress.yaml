# Internal ALB in front of fraud-service.
#
# The ALB *scheme* (internal), subnet discovery, the frontend security group's
# rule to the nodes, and the `alb` IngressClass itself are all owned by the
# platform repo `fdp-infra-compute`. This Ingress only asks for an ALB via
# `ingressClassName: alb` and configures the target group / health check.
#
# Env-specific values (parameterised): ALB_SECURITY_GROUP_ID, ALB_NAME.
# For TLS at the ALB, switch listen-ports to '[{"HTTPS":443}]' and add
#   alb.ingress.kubernetes.io/certificate-arn: <acm-arn>
# Otherwise TLS terminates upstream (API Gateway) and the ALB stays HTTP:80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: fraud-detection
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: ${ALB_SECURITY_GROUP_ID}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Ticket says "/healthz"; the Spring Boot image serves readiness under /actuator.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/group.name: fdp-fraud
    alb.ingress.kubernetes.io/load-balancer-name: ${ALB_NAME}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-service
                port:
                  number: 80
