apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-service-config
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: fraud-detection
data:
  # Spring / JVM
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "${APP_ENV}"
  LOG_LEVEL_APP: "${LOG_LEVEL_APP}"

  # Async audit trail -> DynamoDB (needs the IRSA role on the ServiceAccount)
  AWS_REGION: "${AWS_REGION}"
  AUDIT_DYNAMODB_ENABLED: "${AUDIT_DYNAMODB_ENABLED}"
  AUDIT_DYNAMODB_TABLE_NAME: "${AUDIT_DYNAMODB_TABLE_NAME}"

  # Fraud decisioning - override any of these without a code change
  FRAUD_DECISION_CHALLENGE_SCORE: "${FRAUD_DECISION_CHALLENGE_SCORE}"
  FRAUD_DECISION_BLOCK_SCORE: "${FRAUD_DECISION_BLOCK_SCORE}"

  FRAUD_RULES_HIGH_VALUE_ENABLED: "${FRAUD_RULES_HIGH_VALUE_ENABLED}"
  FRAUD_RULES_VELOCITY_ENABLED: "${FRAUD_RULES_VELOCITY_ENABLED}"
  FRAUD_RULES_VELOCITY_MAX_TRANSACTIONS: "${FRAUD_RULES_VELOCITY_MAX_TRANSACTIONS}"
  FRAUD_RULES_VELOCITY_WINDOW_SECONDS: "${FRAUD_RULES_VELOCITY_WINDOW_SECONDS}"
  FRAUD_RULES_LOCATION_DEVIATION_ENABLED: "${FRAUD_RULES_LOCATION_DEVIATION_ENABLED}"
  FRAUD_RULES_FAILED_THEN_SUCCESS_ENABLED: "${FRAUD_RULES_FAILED_THEN_SUCCESS_ENABLED}"
  FRAUD_RULES_SUSPICIOUS_TRANSFER_ENABLED: "${FRAUD_RULES_SUSPICIOUS_TRANSFER_ENABLED}"
