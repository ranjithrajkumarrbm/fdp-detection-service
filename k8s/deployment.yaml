apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: fraud-detection
    app.kubernetes.io/version: "${IMAGE_TAG}"
spec:
  # replicas is intentionally omitted: the HorizontalPodAutoscaler in k8s/hpa.yaml
  # owns the replica count (min = ${HPA_MIN}). Setting it here would fight the HPA
  # on every `kubectl apply`.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
        app.kubernetes.io/part-of: fraud-detection
        app.kubernetes.io/version: "${IMAGE_TAG}"
    spec:
      serviceAccountName: fraud-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fraud-service
          # Env-specific: registry is injected by CI (`kubectl set image`);
          # REPLACE_ME is only a placeholder for a bare `kubectl apply`.
          image: REPLACE_ME/fraud-service:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-service-config
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          # NOTE: the platform ticket references "/healthz"; the actual Spring Boot
          # image serves the equivalent liveness/readiness probes under /actuator.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
