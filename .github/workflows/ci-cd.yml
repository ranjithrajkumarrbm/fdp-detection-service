name: ci-cd

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to EKS after pushing the image"
        type: boolean
        default: true

# ---------------------------------------------------------------------------
# All deployment specifics come from GitHub repo/environment *Variables*
# (Settings -> Secrets and variables -> Actions -> Variables) so nothing here
# needs a code change to point at a different account/cluster/repo.
#
# Variables (with sane fallbacks): AWS_REGION, ECR_REPOSITORY, EKS_CLUSTER_NAME,
#   K8S_NAMESPACE, HPA_MIN, HPA_MAX, ALB_TARGET_GROUP_ARN, APP_ENV, LOG_LEVEL_APP,
#   AUDIT_DYNAMODB_ENABLED, AUDIT_DYNAMODB_TABLE_NAME, AUDIT_IRSA_ROLE_ARN,
#   FRAUD_DECISION_CHALLENGE_SCORE, FRAUD_DECISION_BLOCK_SCORE, FRAUD_RULES_*
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# ALB_TARGET_GROUP_ARN comes from `terraform output` in fdp-infra-compute
# (alb_target_group_arn) - the ALB/listener/target-group are pre-provisioned there.
# AUDIT_IRSA_ROLE_ARN: IAM role (OIDC-trusted) allowing dynamodb:PutItem on the
# audit table; required only when AUDIT_DYNAMODB_ENABLED=true.
# ---------------------------------------------------------------------------
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'fdp/fraud-detection-service-repo' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'fdp-dev-euw2-eks' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'fraud' }}
  HPA_MIN: ${{ vars.HPA_MIN || '2' }}
  HPA_MAX: ${{ vars.HPA_MAX || '10' }}
  ALB_TARGET_GROUP_ARN: ${{ vars.ALB_TARGET_GROUP_ARN }}
  APP_ENV: ${{ vars.APP_ENV || 'dev' }}
  LOG_LEVEL_APP: ${{ vars.LOG_LEVEL_APP || 'INFO' }}
  AUDIT_DYNAMODB_ENABLED: ${{ vars.AUDIT_DYNAMODB_ENABLED || 'false' }}
  AUDIT_DYNAMODB_TABLE_NAME: ${{ vars.AUDIT_DYNAMODB_TABLE_NAME || 'fdp-audit-table' }}
  AUDIT_IRSA_ROLE_ARN: ${{ vars.AUDIT_IRSA_ROLE_ARN }}
  FRAUD_DECISION_CHALLENGE_SCORE: ${{ vars.FRAUD_DECISION_CHALLENGE_SCORE || '40' }}
  FRAUD_DECISION_BLOCK_SCORE: ${{ vars.FRAUD_DECISION_BLOCK_SCORE || '80' }}
  FRAUD_RULES_HIGH_VALUE_ENABLED: ${{ vars.FRAUD_RULES_HIGH_VALUE_ENABLED || 'true' }}
  FRAUD_RULES_VELOCITY_ENABLED: ${{ vars.FRAUD_RULES_VELOCITY_ENABLED || 'true' }}
  FRAUD_RULES_VELOCITY_MAX_TRANSACTIONS: ${{ vars.FRAUD_RULES_VELOCITY_MAX_TRANSACTIONS || '4' }}
  FRAUD_RULES_VELOCITY_WINDOW_SECONDS: ${{ vars.FRAUD_RULES_VELOCITY_WINDOW_SECONDS || '120' }}
  FRAUD_RULES_LOCATION_DEVIATION_ENABLED: ${{ vars.FRAUD_RULES_LOCATION_DEVIATION_ENABLED || 'true' }}
  FRAUD_RULES_FAILED_THEN_SUCCESS_ENABLED: ${{ vars.FRAUD_RULES_FAILED_THEN_SUCCESS_ENABLED || 'true' }}
  FRAUD_RULES_SUSPICIOUS_TRANSFER_ENABLED: ${{ vars.FRAUD_RULES_SUSPICIOUS_TRANSFER_ENABLED || 'true' }}

jobs:
  build-test:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: mvn -B -ntp clean verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/fdp-detection-service.jar
          retention-days: 5

  image-and-deploy:
    name: Build image, push to ECR, deploy to EKS
    needs: build-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
                 --image-scanning-configuration scanOnPush=true

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE=$IMAGE"          >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG"  >> "$GITHUB_ENV"
          echo "image=$IMAGE"          >> "$GITHUB_OUTPUT"

      - name: Deploy to EKS
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

          # Only substitute the placeholders we own; leave any other $... untouched.
          # shellcheck disable=SC2016  # $VARs here are envsubst's SHELL-FORMAT arg, not shell expansions
          SUBST='$IMAGE $IMAGE_TAG $K8S_NAMESPACE $HPA_MIN $HPA_MAX $ALB_TARGET_GROUP_ARN $APP_ENV $LOG_LEVEL_APP $AWS_REGION $AUDIT_DYNAMODB_ENABLED $AUDIT_DYNAMODB_TABLE_NAME $AUDIT_IRSA_ROLE_ARN $FRAUD_DECISION_CHALLENGE_SCORE $FRAUD_DECISION_BLOCK_SCORE $FRAUD_RULES_HIGH_VALUE_ENABLED $FRAUD_RULES_VELOCITY_ENABLED $FRAUD_RULES_VELOCITY_MAX_TRANSACTIONS $FRAUD_RULES_VELOCITY_WINDOW_SECONDS $FRAUD_RULES_LOCATION_DEVIATION_ENABLED $FRAUD_RULES_FAILED_THEN_SUCCESS_ENABLED $FRAUD_RULES_SUSPICIOUS_TRANSFER_ENABLED'

          for f in namespace serviceaccount configmap deployment hpa service targetgroupbinding; do
            echo "---- applying k8s/$f.yaml ----"
            envsubst "$SUBST" < "k8s/$f.yaml" | kubectl apply -f -
          done

          # Point the deployment at the freshly pushed ECR image (overrides the
          # REPLACE_ME placeholder baked into k8s/deployment.yaml).
          kubectl -n "$K8S_NAMESPACE" set image deployment/fraud-service \
            fraud-service="$IMAGE" --record=false
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/fraud-service --timeout=240s
          kubectl -n "$K8S_NAMESPACE" get targetgroupbinding fraud-service
          aws elbv2 describe-target-health --region "$AWS_REGION" \
            --target-group-arn "$ALB_TARGET_GROUP_ARN" \
            --query 'TargetHealthDescriptions[].TargetHealth.State' --output text
